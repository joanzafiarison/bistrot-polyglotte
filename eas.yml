# Lance une commande EAS (Expo) depuis GitHub.
# Onglet "Actions" › "EAS" › "Run workflow", puis choisis la commande.
# Prérequis : le secret EXPO_TOKEN (Settings › Secrets and variables › Actions).
name: EAS

on:
  workflow_dispatch:
    inputs:
      commande:
        description: Commande à lancer
        type: choice
        default: build-preview
        options:
          - init               # une seule fois : crée le projet sur expo.dev
          - build-preview      # APK Android à installer sur un téléphone
          - build-production   # AAB Android pour le Play Store
          - build-and-submit   # AAB + envoi sur le Play Store (piste "internal")
      plateforme:
        description: Plateforme
        type: choice
        default: android
        options: [android, ios, all]
  push:
    tags: ['v*']   # pousser un tag v1.0.1 lance un build de production Android

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eas:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour enregistrer app.json après "init"
    env:
      COMMANDE: ${{ inputs.commande || 'build-production' }}
      PLATEFORME: ${{ inputs.plateforme || 'android' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Vérifier le jeton Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Le secret EXPO_TOKEN est absent. Ajoute-le dans Settings › Secrets and variables › Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer EAS CLI et se connecter à Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      - name: Lier le projet à expo.dev
        if: env.COMMANDE == 'init'
        run: |
          eas init --non-interactive --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git diff --cached --quiet || git commit -m "Lier le projet à EAS"
          git push

      - name: Vérifier que le projet est lié
        if: env.COMMANDE != 'init'
        run: |
          if ! grep -q '"projectId"' app.json; then
            echo "::error::Le projet n'est pas encore lié à expo.dev. Lance d'abord la commande « init »."
            exit 1
          fi

      - name: Build de test (APK)
        if: env.COMMANDE == 'build-preview'
        run: eas build --platform "$PLATEFORME" --profile preview --non-interactive --no-wait

      - name: Build de production
        if: env.COMMANDE == 'build-production'
        run: eas build --platform "$PLATEFORME" --profile production --non-interactive --no-wait

      - name: Build de production et envoi au store
        if: env.COMMANDE == 'build-and-submit'
        run: eas build --platform "$PLATEFORME" --profile production --non-interactive --no-wait --auto-submit

      - name: Où trouver le résultat
        if: env.COMMANDE != 'init'
        run: echo "::notice::Build lancé. Suis-le sur https://expo.dev (projet bistrot-polyglotte › Builds)."